# Deploy from repo root: fly deploy --config platform/fly.toml
app = "sygma-platform-cms"
primary_region = "ewr"

[build]
  dockerfile = "platform/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
